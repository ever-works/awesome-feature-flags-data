markdown: >-
  ## Overview


  FeatureVisor is a feature management platform designed for developers,
  emphasizing GitOps workflows. It allows teams to define feature flags and
  targeting rules in version-controlled files and deploy them consistently
  across environments.


  ## Features


  - Feature flag management

  - GitOps-based workflow

  - Version-controlled configuration

  - TypeScript SDKs

  - Targeting and segmentation

  - Rollout management


  ## Pricing


  Free and open-source.


  ## Repository


  https://github.com/featurevisor/featurevisor
