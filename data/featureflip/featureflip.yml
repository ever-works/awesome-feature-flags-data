markdown: >-
  ## Overview


  Featureflip is a full-featured feature flag platform that removes its own dead
  flags by submitting its own pull requests. It is designed for developers who
  want automated flag lifecycle management.


  ## Key Features


  - Full-featured feature flag management

  - Automatic dead flag removal via pull requests

  - Free plan includes 10 flags, 2 environments, 1 project, 3 users

  - No usage caps


  ## Deployment


  Cloud-hosted managed platform


  ## Pricing


  Free plan available; paid plans for larger teams and higher usage.
