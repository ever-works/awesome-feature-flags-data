markdown: >-
  ## Overview


  Toggled.dev is an enterprise-ready, scalable multi-regional feature toggles
  management platform designed for teams that need reliable feature flag
  infrastructure across regions.


  ## Key Features


  - Multi-regional feature toggle management

  - SDK for application integration

  - Analytics dashboard

  - Release calendar

  - Slack notifications

  - Unlimited requests on free plan

  - Up to 10 flags, two environments on free plan


  ## Deployment


  Cloud-hosted managed platform


  ## Pricing


  Free plan: up to 10 flags, two environments, unlimited requests, SDK,
  analytics dashboard, release calendar, Slack notifications.
