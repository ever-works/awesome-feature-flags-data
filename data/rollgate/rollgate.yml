markdown: >-
  ## Overview


  Rollgate is an EU-hosted feature flag management platform offering scheduled
  releases, instant rollback, and A/B testing. It includes 12 SDKs for various
  platforms.


  ## Key Features


  - Scheduled releases

  - Instant rollback

  - A/B testing

  - 12 SDKs included

  - EU-hosted for data residency

  - Unlimited flags

  - 3 team members on free plan

  - No credit card required


  ## Deployment


  Cloud-hosted (EU)


  ## Pricing


  Free plan: up to 500K API requests/month, unlimited flags, 3 team members, no
  credit card required.
