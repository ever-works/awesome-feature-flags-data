markdown: >-
  ## Overview


  CloudBees is a cloud-based platform providing end-to-end automated software
  delivery. It includes feature management and feature flag capabilities as part
  of its CI/CD and DevOps platform, with support for OpenFeature SDKs.


  ## Features


  - Feature management

  - Feature flags

  - CI/CD integration

  - OpenFeature SDK support

  - Enterprise-grade security

  - Automated software delivery

  - Managed cloud platform


  ## Pricing


  Paid enterprise platform.
